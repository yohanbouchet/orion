# Fichier  : sonar-project.properties
# Rôle     : configuration de l'analyse SonarQube (projet, code, tests,
#            rapports de couverture). Aucun secret : le jeton vient de la CI.
# Utilise  : rapports produits par les tests (JaCoCo, lcov, JUnit)
# Utilisé par : .github/workflows/ci.yml (job sonarqube, action officielle)

# Projet SonarQube existant (clé utilisée depuis l'analyse d'origine)
sonar.projectKey=orion
sonar.projectName=Orion MicroCRM
sonar.sourceEncoding=UTF-8

# Code analysé : front et back, sans les fichiers de test
sonar.sources=front/src,back/src/main
sonar.exclusions=front/src/**/*.spec.ts

# Tests : fichiers *.spec.ts du front, dossier de test du back
sonar.tests=front/src,back/src/test
sonar.test.inclusions=front/src/**/*.spec.ts,back/src/test/**

# Java : SonarQube analyse aussi le code compilé (fourni par le job
# test-back sous forme d'artefact)
sonar.java.binaries=back/build/classes/java/main
sonar.java.test.binaries=back/build/classes/java/test

# Rapports produits par les tests (tickets #13 et #16)
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info
sonar.junit.reportPaths=back/build/test-results/test

# Attendre le verdict du Quality Gate : s'il échoue, l'analyse échoue et
# la PR est bloquée (limite : 5 min)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

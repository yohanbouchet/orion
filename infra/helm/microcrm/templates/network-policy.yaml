{{- /*
Fichier  : infra/helm/microcrm/templates/network-policy.yaml
Rôle     : pare-feu entre pods : tout est refusé dans le namespace, sauf
           front → back → base (et la résolution DNS) ; vmagent (namespace
           monitoring) lit les métriques du back (port 8081) ; en staging,
           les pods des tests ZAP (intrusion) et k6 (charge) peuvent
           joindre le front, et eux seuls ; k6 envoie aussi ses mesures à
           VictoriaMetrics
Utilise  : values.yaml (networkPolicy.*) ; _helpers.tpl
Utilisé par : Kubernetes (appliqué par kindnet dans Minikube) ; tickets #64
           et #92
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $front := dict "root" $ "component" "front" }}
{{- $back := dict "root" $ "component" "back" }}
{{- $db := dict "root" $ "component" "postgres" }}
{{- $zap := .Values.networkPolicy.allowZap }}
{{- $k6 := .Values.networkPolicy.allowK6 }}
# 1. Refus par défaut : aucun pod du namespace (ceux du chart, ZAP, ou
# tout autre pod lancé plus tard) ne reçoit ni n'envoie rien ; les règles
# suivantes ouvrent seulement le nécessaire
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2. Front : reçoit les visiteurs (port 8080) ; appelle le back et le DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microcrm.name" $front }}
spec:
  podSelector:
    matchLabels:
      {{- include "microcrm.selectorLabels" $front | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  # Aucun autre pod, sauf ZAP (allowZap) et k6 (allowK6) ; kubectl
  # port-forward entre par l'intérieur du pod et n'est pas concerné
  {{- if or $zap $k6 }}
  ingress:
    {{- if $zap }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zap
      ports:
        - port: 8080
    {{- end }}
    {{- if $k6 }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: k6
      ports:
        - port: 8080
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "microcrm.selectorLabels" $back | nindent 14 }}
      ports:
        - port: 8080
    {{- include "microcrm.dnsEgress" . | nindent 4 }}
---
# 3. Back : reçoit le front (API) et vmagent (métriques, port de gestion) ;
# appelle seulement la base et le DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microcrm.name" $back }}
spec:
  podSelector:
    matchLabels:
      {{- include "microcrm.selectorLabels" $back | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "microcrm.selectorLabels" $front | nindent 14 }}
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "microcrm.selectorLabels" $db | nindent 14 }}
      ports:
        - port: 5432
    {{- include "microcrm.dnsEgress" . | nindent 4 }}
---
# 4. Base : reçoit seulement le back ; n'appelle personne
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microcrm.name" $db }}
spec:
  podSelector:
    matchLabels:
      {{- include "microcrm.selectorLabels" $db | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "microcrm.selectorLabels" $back | nindent 14 }}
      ports:
        - port: 5432
{{- if $zap }}
---
# 5. ZAP (scripts/zap-scan.sh) : ne reçoit rien ; ne joint que le front
# et le DNS (pas Internet, pas le back ni la base en direct)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-zap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zap
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "microcrm.selectorLabels" $front | nindent 14 }}
      ports:
        - port: 8080
    {{- include "microcrm.dnsEgress" . | nindent 4 }}
{{- end }}
{{- if $k6 }}
---
# 6. k6 (scripts/load-test.sh) : ne reçoit rien ; ne joint que le front,
# le DNS et VictoriaMetrics (ses mesures), pas Internet ni la base
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-k6
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: k6
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "microcrm.selectorLabels" $front | nindent 14 }}
      ports:
        - port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmsingle
      ports:
        - port: 8428
    {{- include "microcrm.dnsEgress" . | nindent 4 }}
{{- end }}
{{- end }}

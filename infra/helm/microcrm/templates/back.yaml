{{- /*
Fichier  : infra/helm/microcrm/templates/back.yaml
Rôle     : API Spring Boot : adresse fixe (Service), Deployment avec
           mise à jour progressive sans coupure, et mise à l'échelle
           automatique (HPA) si back.autoscaling.enabled
Utilise  : values.yaml (back.*, postgres.*) ; image GHCR orion-back ;
           image de la base (psql) ; Secrets des 2 comptes de la base ;
           templates/postgres-app-role.yaml ; _helpers.tpl
Utilisé par : le front (relais /api, templates/front.yaml) ; vmagent
              (métriques, port 8081) ; tickets #64 et #84
*/}}
{{- $ctx := dict "root" $ "component" "back" }}
{{- $name := include "microcrm.name" $ctx }}
{{- $db := include "microcrm.name" (dict "root" $ "component" "postgres") }}
{{- $pg := .Values.postgres }}
{{- $url := printf "jdbc:postgresql://%s:5432/%s" $db $pg.database }}
{{- $appRoleFile := print $.Template.BasePath "/postgres-app-role.yaml" }}
{{- $appRole := include $appRoleFile $ }}
{{- $pgImage := include "microcrm.image" (dict "root" $ "image" $pg.image) }}
{{- with .Values.back }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "microcrm.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "microcrm.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "microcrm.labels" $ctx | nindent 4 }}
spec:
  {{- if not .autoscaling.enabled }}
  replicas: {{ .replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "microcrm.selectorLabels" $ctx | nindent 6 }}
  # Mise à jour progressive : un nouveau pod démarre et doit être prêt
  # AVANT qu'un ancien soit arrêté (aucune coupure avec 2 répliques)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "microcrm.labels" $ctx | nindent 8 }}
      annotations:
        # Empreinte du script SQL : s'il change, les pods sont recréés et
        # le conteneur d'initialisation le rejoue
        checksum/app-role: {{ $appRole | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # Compte « app » de l'image (numéro 1001), comme back/Dockerfile
        {{- include "microcrm.podSecurityContext" 1001 | nindent 8 }}
      # Avant l'API : crée ou met à jour le compte limité de l'appli
      # (psql de l'image de la base, connecté en superutilisateur) ; ce
      # conteneur s'arrête avant que l'API démarre
      initContainers:
        - name: db-app-role
          image: {{ $pgImage }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          # Attend que la base accepte les connexions, puis lance le script
          # (ON_ERROR_STOP : la 1re erreur arrête tout, code de sortie 3)
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready --quiet; do sleep 2; done
              exec psql --no-psqlrc --set=ON_ERROR_STOP=1 \
                --file=/sql/app-role.sql
          # Variables lues par psql (PG*) et par le script (APP_*)
          env:
            - name: PGHOST
              value: {{ $db | quote }}
            - name: PGDATABASE
              value: {{ $pg.database | quote }}
            - name: PGUSER
              value: {{ $pg.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.existingSecret }}
                  key: {{ $pg.secretKey }}
            - name: APP_USER
              value: {{ $pg.appUsername | quote }}
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.appExistingSecret }}
                  key: {{ $pg.secretKey }}
          securityContext:
            {{- include "microcrm.containerSecurityContext" . | nindent 12 }}
          # psql n'ouvre qu'une connexion : très peu de ressources
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: app-role-sql
              mountPath: /sql
              readOnly: true
      containers:
        - name: back
          image: {{ include "microcrm.image" (dict "root" $ "image" .image) }}
          imagePullPolicy: {{ .image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            # Port de gestion (Actuator) : santé et métriques, lu par les
            # sondes et par vmagent ; absent du Service public
            - name: management
              containerPort: 8081
          env:
            # Connexion à la base du même environnement (ticket #66) avec
            # le compte limité ; mots de passe lus dans les Secrets, jamais
            # écrits dans le chart
            - name: SPRING_DATASOURCE_URL
              value: {{ $url | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $pg.appUsername | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.appExistingSecret }}
                  key: {{ $pg.secretKey }}
            # Flyway (création des tables, au démarrage seulement) garde
            # le compte propriétaire des tables, sur sa propre connexion
            - name: SPRING_FLYWAY_USER
              value: {{ $pg.username | quote }}
            - name: SPRING_FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.existingSecret }}
                  key: {{ $pg.secretKey }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .javaToolOptions | quote }}
            # Journaux au format JSON (ECS, Elastic Common Schema, intégré
            # à Spring Boot) : une ligne = un objet (niveau, message, trace
            # d'erreur complète), lu champ par champ par VictoriaLogs ; en
            # local (bootRun, tests), le texte habituel reste plus lisible
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            # Chaque ligne dit quelle version et quel environnement l'ont
            # écrite (version donnée par deploy.sh au paquet du chart)
            - name: LOGGING_STRUCTURED_ECS_SERVICE_VERSION
              value: {{ $.Chart.AppVersion | quote }}
            - name: LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT
              value: {{ $.Release.Namespace | quote }}
          securityContext:
            {{- include "microcrm.containerSecurityContext" . | nindent 12 }}
          # Sondes sur Actuator (port de gestion, ticket #84) :
          # « liveness » = l'appli tourne ; « readiness » = elle peut
          # servir (la base répond)
          # Démarrage de Spring Boot : jusqu'à 3 min avant les autres sondes
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          # Reçoit du trafic seulement quand l'API est prête
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
          # Redémarré s'il ne répond plus pendant 1 min
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            failureThreshold: 3
          # Arrêt sans requête perdue : à l'ordre d'arrêt, le pod continue
          # de répondre 10 s, le temps que le Service cesse de lui envoyer
          # des requêtes ; ensuite seulement, Spring Boot s'arrête en
          # douceur (requêtes en cours terminées) ; le tout tient dans les
          # 30 s laissées par Kubernetes avant l'arrêt forcé
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            # Seul dossier inscriptible : fichiers temporaires de Tomcat
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        # Script SQL du compte limité, en lecture seule
        - name: app-role-sql
          configMap:
            name: {{ $db }}-app-role
{{- if .autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "microcrm.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .autoscaling.minReplicas }}
  maxReplicas: {{ .autoscaling.maxReplicas }}
  # Ajoute un pod quand le processeur moyen dépasse la cible (en % de la
  # demande « requests.cpu »)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}

# Fichier  : infra/helm/microcrm/values.yaml
# Rôle     : réglages par défaut du chart, valables pour tous les
#            environnements ; values-dev, -staging et -prod n'écrivent que
#            leurs différences
# Utilise  : images GHCR orion-front et orion-back (publiées par la CI),
#            image PostgreSQL durcie (infra/postgres, chargée dans Minikube)
# Utilisé par : templates/ ; scripts/deploy.sh ; scripts/backup.sh (mêmes
#               noms de base et de compte) ; ticket #64

front:
  image:
    repository: ghcr.io/yohanbouchet/orion-front
    # Vide : étiquette v<appVersion> de Chart.yaml (ex. v1.1.0)
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # Valeurs de départ, à ajuster après mesure (kubectl top pods)
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

back:
  image:
    repository: ghcr.io/yohanbouchet/orion-back
    tag: ""
    pullPolicy: IfNotPresent
  # Ignoré si autoscaling.enabled : c'est alors le HPA qui décide
  replicas: 1
  # Java règle sa mémoire sur la limite du conteneur (75 % pour le tas)
  javaToolOptions: "-XX:MaxRAMPercentage=75"
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 768Mi
  # Mise à l'échelle automatique (HPA) selon le processeur ; il faut
  # l'addon metrics-server de Minikube
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

postgres:
  image:
    repository: orion/postgres
    tag: 18.6-hardened
    # Image construite et chargée dans Minikube, jamais téléchargée
    pullPolicy: Never
  database: microcrm
  username: microcrm
  # Secret créé HORS du chart (scripts/deploy.sh, valeur aléatoire) : le
  # mot de passe n'est jamais écrit dans Git ni dans les valeurs Helm
  existingSecret: microcrm-db
  secretKey: password
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

networkPolicy:
  # Pare-feu entre pods : tout est interdit sauf front → back → base
  enabled: true
  # Pod du test d'intrusion ZAP autorisé à joindre le front (staging)
  allowZap: false

# Fichier  : infra/ansible/ansible.cfg
# Rôle     : réglages d'Ansible pour ce dossier : inventaire local,
#            collections du projet, affichage lisible, sudo classique
# Utilise  : inventory.ini, requirements.yml (collections installées dans
#            ./collections, hors Git)
# Utilisé par : ansible-playbook et ansible-lint lancés depuis ce dossier

[defaults]
inventory = inventory.ini
roles_path = roles
# Collections aux versions figées de requirements.yml, pas celles du système
collections_path = collections
# Affichage lisible ; les tâches sautées (condition fausse) sont masquées
stdout_callback = default
display_skipped_hosts = false
# Pas de fichier .retry laissé dans le dépôt après un échec
retry_files_enabled = false

[privilege_escalation]
# sudo classique (sudo.ws) : avec sudo-rs, sudo par défaut d'Ubuntu
# depuis la 25.10, Ansible attend une invite qui ne vient jamais (bug
# Launchpad #2122414, non corrigé au 04/11/2026)
become_exe = sudo.ws

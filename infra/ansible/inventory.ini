# Fichier  : infra/ansible/inventory.ini
# Rôle     : machine configurée : le poste Ops qui héberge le cluster
#            Minikube, en local (aucune connexion SSH)
# Utilisé par : ansible.cfg (inventaire par défaut)

[ops]
# Python officiel d'Ubuntu (lien stable), plutôt que deviné par Ansible
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

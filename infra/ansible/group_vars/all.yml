# Fichier  : infra/ansible/group_vars/all.yml
# Rôle     : réglages du poste Ops, au même endroit : versions figées et
#            empreintes SHA-256 (relevées le 04/11/2026), horaires,
#            réseaux autorisés
# Utilisé par : site.yml et tous les rôles

# Utilisateur qui lance le playbook (jamais root) et racine du dépôt
ops_user: "{{ ansible_facts['user_id'] }}"
ops_home: "{{ ansible_facts['env']['HOME'] }}"
repo_dir: "{{ (playbook_dir ~ '/../..') | realpath }}"
minikube_profile: orion

# Outils du poste, dans ~/.local/bin (sans sudo), empreinte vérifiée
ops_tools:
  - name: kubectl
    url: https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
    sha256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
  - name: minikube
    url: https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64
    sha256: b738496da01be06bbaf80c688f57ce25acd3849fbb518155f3a88e03ef555aa4
helm_version: v4.3.1
helm_sha256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
# Terraform vient du dépôt apt de HashiCorp : on vérifie seulement sa version
terraform_min_version: 1.17.0

# Images construites sur le poste et chargées dans Minikube
cluster_images:
  - name: orion/postgres:18.6-hardened
    context: infra/postgres
  - name: orion/zap:2.17.0-hardened
    context: infra/zap
  - name: orion/actions-runner:2.338.2-hardened.2
    context: infra/arc

# metrics-server 0.9.1 (reconstruction de sécurité du 29/10/2026), figé
# par empreinte ; l'addon de Minikube installe sinon la 0.9.0
metrics_server_image: "metrics-server/metrics-server:v0.9.1@sha256:9b0ba1926e1d3089673f45461c3c1416109dea33b3ba3434048defd380df329b"

# Sauvegarde de la prod : chaque nuit, vérification de la restauration
# chaque dimanche ; dossier copié hors site par la sauvegarde chiffrée
# de la machine
backup_env: prod
backup_dir: "{{ ops_home }}/backups/microcrm"
backup_log: "{{ ops_home }}/.local/state/microcrm-backup.log"

# Docker : journaux limités à 3 fichiers de 10 Mo par conteneur ;
# nettoyage chaque semaine de ce qui n'a pas servi depuis 7 jours
docker_log_max_size: 10m
docker_log_max_file: "3"
docker_prune_until: 168h

# Réseaux autorisés par le pare-feu : SSH depuis le réseau local ;
# métriques de la machine depuis le réseau du cluster Minikube
lan_cidr: 192.168.1.0/24

# node_exporter : métriques de la machine (disque, mémoire) pour la
# supervision ; dernière version, vérifiée le 04/11/2026
node_exporter_version: 1.12.1
node_exporter_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
node_exporter_releases: https://github.com/prometheus/node_exporter/releases/download
node_exporter_url: "{{ node_exporter_releases }}/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"

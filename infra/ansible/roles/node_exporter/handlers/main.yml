# Fichier  : infra/ansible/roles/node_exporter/handlers/main.yml
# Rôle     : relance node_exporter quand son binaire ou son service change
# Utilisé par : tasks/main.yml (notify)

- name: Restart node_exporter
  become: true
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted
    daemon_reload: true

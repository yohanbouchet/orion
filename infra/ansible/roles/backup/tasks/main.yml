# Fichier  : infra/ansible/roles/backup/tasks/main.yml
# Rôle     : sauvegarde automatique de la base de prod : au démarrage du
#            poste et chaque jour à 12 h 30, et vérification chaque
#            vendredi qu'elle se restaure vraiment
#            (base temporaire) ; journal dans ~/.local/state
# Utilise  : scripts/backup.sh ; group_vars/all.yml (backup_*,
#            node_exporter_textfile_dir : métrique de la sauvegarde)
# Utilisé par : site.yml

# Dossier lisible par l'Ops seul : une sauvegarde contient des données
# personnelles
- name: Create the backup folder
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: "0700"

- name: Create the log folder
  ansible.builtin.file:
    path: "{{ backup_log | dirname }}"
    state: directory
    mode: "0700"

# Chaque jour à 12 h 30, poste allumé (copiée hors site par la sauvegarde
# Google Drive de 18 h) ; cron n'a pas le PATH de la session : on donne
# celui des outils du poste
- name: Back up the production database every day
  ansible.builtin.cron:
    name: microcrm backup (ansible)
    hour: "12"
    minute: "30"
    job: >-
      PATH={{ ops_home }}/.local/bin:/usr/bin:/bin
      BACKUP_DIR={{ backup_dir }}
      BACKUP_METRICS_DIR={{ node_exporter_textfile_dir }}
      {{ repo_dir }}/scripts/backup.sh {{ backup_env }}
      >> {{ backup_log }} 2>&1

# Au démarrage du poste, 5 min après (le temps que Minikube démarre) : une
# sauvegarde fraîche dès l'allumage, l'alerte BackupTooOld ne sonne pas à
# tort après une nuit ou un week-end éteint
- name: Back up the production database when the host starts
  ansible.builtin.cron:
    name: microcrm backup at boot (ansible)
    special_time: reboot
    job: >-
      sleep 300 &&
      PATH={{ ops_home }}/.local/bin:/usr/bin:/bin
      BACKUP_DIR={{ backup_dir }}
      BACKUP_METRICS_DIR={{ node_exporter_textfile_dir }}
      {{ repo_dir }}/scripts/backup.sh {{ backup_env }}
      >> {{ backup_log }} 2>&1

# Une sauvegarde jamais restaurée n'est pas une sauvegarde ; le vendredi
# à 13 h, poste allumé (il est éteint le soir : cron ne rattrape pas)
- name: Check every week that the last backup restores
  ansible.builtin.cron:
    name: microcrm backup verify (ansible)
    weekday: "5"
    hour: "13"
    minute: "0"
    job: >-
      PATH={{ ops_home }}/.local/bin:/usr/bin:/bin
      BACKUP_DIR={{ backup_dir }}
      {{ repo_dir }}/scripts/backup.sh verify {{ backup_env }}
      >> {{ backup_log }} 2>&1

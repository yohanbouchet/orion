# Fichier  : infra/openbao/values.yaml
# Rôle     : réglages du chart Helm d'OpenBao (coffre-fort de secrets,
#            licence MPL-2.0) : un serveur, stockage intégré Raft,
#            chiffrement TLS, conteneur verrouillé, pare-feu réseau
# Utilise  : Secret openbao-tls (certificat créé par
#            infra/terraform/openbao.tf)
# Utilisé par : infra/terraform/openbao.tf (helm_release.openbao)

global:
  # Tout échange avec OpenBao est chiffré (TLS), même dans le cluster :
  # il transporte des secrets (OWASP ASVS, chiffrement des
  # communications internes)
  tlsDisable: false

# Injecteur de secrets dans les pods : pas utilisé ici, donc pas
# installé (moins de composants exposés)
injector:
  enabled: false

server:
  image:
    registry: quay.io
    repository: openbao/openbao
    # Version et empreinte figées (2.7.2 du 26/10/2026, dernière de la
    # branche 2.7 maintenue, endoflife.date vérifié le 09/11/2026)
    tag: "2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f"

  # OpenBao vérifie lui-même les jetons qu'on lui présente : il n'a pas
  # besoin du droit de vérification de jetons Kubernetes du cluster
  # (ClusterRoleBinding system:auth-delegator)
  authDelegator:
    enabled: false

  # Mesuré sur un serveur seul : quelques dizaines de Mo
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Conteneur verrouillé (niveau « restricted » du namespace) : testé le
  # 09/11 avec Docker (lecture seule, aucune capacité, utilisateur 100)
  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

  # Le CLI bao du pod fait confiance à notre autorité de certification
  extraEnvironmentVars:
    BAO_CACERT: /openbao/tls/ca.crt

  # Certificat TLS (lecture seule) et /tmp, où le chart écrit la
  # configuration finale au démarrage (disque système en lecture seule)
  volumes:
    - name: tls
      secret:
        secretName: openbao-tls
        defaultMode: 0440
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
  volumeMounts:
    - name: tls
      mountPath: /openbao/tls
      readOnly: true
    - name: tmp
      mountPath: /tmp

  # Données chiffrées par OpenBao lui-même (clé de chiffrement scellée) ;
  # 1 Gi suffit largement pour quelques rôles et règles
  dataStorage:
    enabled: true
    size: 1Gi
  # Journal d'audit écrit sur la sortie du conteneur (activé après
  # l'initialisation), donc lu par vlagent : pas de disque dédié
  auditStorage:
    enabled: false

  # Pare-feu réseau : n'entrent sur l'API (8200) que les runners de la
  # CI (arc-runners) ; l'Ops passe par kubectl port-forward. Sortie
  # ouverte : OpenBao appelle l'API de Kubernetes (jetons courts) et
  # GitHub (clés publiques des badges OIDC) ; limite écrite dans le README
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: arc-runners
        ports:
          - port: 8200
            protocol: TCP

  # Un seul serveur (poste unique) ; stockage intégré Raft, déclaré
  # « production ready » par la documentation, avec sauvegarde à chaud
  # (bao operator raft snapshot save)
  standalone:
    enabled: true
    config: |
      # Interface web : servie, mais seulement par port-forward (aucun
      # Service exposé hors du cluster)
      ui = true

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file   = "/openbao/tls/tls.crt"
        tls_key_file    = "/openbao/tls/tls.key"
        # TLS 1.3 seulement : clients récents (CLI bao, curl, runners)
        tls_min_version = "tls13"
      }

      storage "raft" {
        path    = "/openbao/data"
        node_id = "openbao-0"
      }

      # Adresses annoncées (un seul nœud : celle du pod)
      api_addr     = "https://openbao.openbao.svc:8200"
      cluster_addr = "https://openbao-0.openbao-internal:8201"

# Pas de Service supplémentaire pour l'interface web
ui:
  enabled: false

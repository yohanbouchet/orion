# Fichier  : .github/actionlint.yaml
# Rôle     : configuration d'actionlint (vérification des workflows) :
#            déclare l'étiquette de notre runner auto-hébergé.
# Utilise  : rien
# Utilisé par : actionlint (job workflows de ci.yml à chaque PR, et en
#               local avant chaque commit d'un workflow)

self-hosted-runner:
  # Étiquette du groupe de runners ARC (infra/arc/values-orion-runners.yaml)
  labels:
    - orion-local

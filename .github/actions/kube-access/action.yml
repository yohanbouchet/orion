# Fichier  : .github/actions/kube-access/action.yml
# Rôle     : accès au cluster pour un job du runner local : installe
#            kubectl (et helm si demandé), binaires officiels à l'empreinte
#            vérifiée ; échange le badge OIDC du job (signé par GitHub)
#            contre un jeton court du compte deployer, délivré par OpenBao ;
#            écrit le fichier de connexion (kubeconfig) ; action composite,
#            écrite une fois, utilisée par deploy.yml, zap.yml, load-test.yml
# Utilise  : OpenBao (infra/openbao/config : rôles ci-<environnement>) ;
#            certificats publics KUBE_CA et OPENBAO_CA transmis par le job ;
#            le job doit avoir la permission id-token: write
# Utilisé par : .github/workflows/deploy.yml, zap.yml, load-test.yml ;
#               ticket #64
# Le job doit supprimer "$RUNNER_TEMP/kubeconfig" à la fin (if: always()) :
# une action composite n'a pas d'étape finale automatique

name: Kubernetes access
description: Install kubectl (and helm) and get a short-lived deployer token from OpenBao

inputs:
  # Environnement GitHub du job (dev, staging, production) : choisit le
  # rôle OpenBao ci-<environnement>, qui vérifie qu'il correspond au badge
  environment:
    description: GitHub environment of the job
    required: true
  namespace:
    description: Kubernetes namespace of the deployer
    required: true
  ca:
    description: Public certificate (PEM) of the cluster authority
    required: true
  openbao-ca:
    description: Public certificate (PEM) of the OpenBao authority
    required: true
  helm:
    description: Also install helm
    default: "false"

runs:
  using: composite
  steps:
    # Binaires officiels, refusés si leur empreinte ne correspond pas à
    # celle notée ici (fichier modifié en route) ; rangés dans un dossier
    # du job, ajouté au PATH des étapes suivantes. Versions figées et
    # empreintes publiées par Kubernetes et Helm (relevées le 02/11/2026) ;
    # à mettre à jour à la main
    - name: Install kubectl and helm
      shell: bash
      env:
        KUBECTL_VERSION: v1.37.2
        KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
        HELM_VERSION: v4.3.1
        HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        WITH_HELM: ${{ inputs.helm }}
      # Dossier ajouté au PATH (GITHUB_PATH) : chemin fixe du runner
      # ($RUNNER_TEMP), jamais une valeur venue d'un tiers ; aucun
      # workflow appelant n'a de déclencheur dangereux (pas de
      # pull_request_target ni workflow_run) : exception justifiée
      run: | # zizmor: ignore[github-env]
        bin="$RUNNER_TEMP/bin"
        mkdir -p "$bin"
        cd "$RUNNER_TEMP"
        curl -fsSLo kubectl \
          "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
        echo "$KUBECTL_SHA256  kubectl" | sha256sum --check --strict
        install -m 755 kubectl "$bin/kubectl"
        if [ "$WITH_HELM" = "true" ]; then
          curl -fsSLo helm.tar.gz \
            "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tar.gz" | sha256sum --check --strict
          tar -xzf helm.tar.gz linux-amd64/helm
          install -m 755 linux-amd64/helm "$bin/helm"
        fi
        echo "$bin" >> "$GITHUB_PATH"
    # Jeton court, puis fichier de connexion (kubeconfig) lisible par ce
    # seul compte. Une seule étape : le jeton reste dans une variable du
    # shell, jamais dans l'environnement des étapes suivantes ; chaque
    # valeur sensible est masquée dans les journaux (add-mask) dès qu'elle
    # existe ; en-têtes passés par fichier (invisibles dans la liste des
    # processus)
    - name: Get a short-lived token and write kubeconfig
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        NAMESPACE: ${{ inputs.namespace }}
        KUBE_CA: ${{ inputs.ca }}
        OPENBAO_CA: ${{ inputs.openbao-ca }}
        # Service d'OpenBao dans le cluster (HTTPS, nom présent dans son
        # certificat) ; audience propre : un badge demandé pour un autre
        # service y est refusé
        OPENBAO_ADDR: https://openbao.openbao.svc:8200
        AUDIENCE: openbao-orion
      # KUBECONFIG (GITHUB_ENV) : chemin fixe du runner, jamais une valeur
      # venue d'un tiers ; le jeton reste dans le fichier, pas dans
      # l'environnement ; exception justifiée (même raison que plus haut)
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        umask 077
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::Missing id-token: write permission on the job"
          exit 1
        fi
        if [ -z "$OPENBAO_CA" ]; then
          echo "::error::OPENBAO_CA is empty; set the repository variable"
          exit 1
        fi
        work="$(mktemp -d "$RUNNER_TEMP/kube-access.XXXXXX")"
        trap 'rm -rf "${work:?}"' EXIT
        printf '%s\n' "$OPENBAO_CA" > "$work/openbao-ca.pem"

        # Appel à OpenBao : réponse rangée dans un fichier (jamais
        # affichée, elle contient le jeton) ; en cas de refus, seul le
        # message d'erreur d'OpenBao est affiché (il ne contient aucun
        # secret : ex. « claim "ref" does not match »)
        bao_call() {
          local path="$1" code
          shift
          code="$(curl -sS --cacert "$work/openbao-ca.pem" "$@" \
            -o "$work/response.json" -w '%{http_code}' \
            "$OPENBAO_ADDR/v1/$path")"
          if [ "$code" != "200" ]; then
            echo "::error::OpenBao refused $path (HTTP $code): $(jq -r \
              '(.errors // ["no message"]) | join("; ")' \
              "$work/response.json" 2>/dev/null)"
            exit 1
          fi
        }

        # 1. Badge OIDC du job, signé par GitHub (dépôt, branche,
        #    environnement, workflow), valable quelques minutes
        printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          > "$work/gh-header"
        jwt="$(curl -fsS -H @"$work/gh-header" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value')"
        if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
          echo "::error::GitHub gave no OIDC token"
          exit 1
        fi
        echo "::add-mask::$jwt"

        # 2. OpenBao vérifie le badge et rend un jeton limité à la règle
        #    de cet environnement
        jq -n --arg role "ci-$ENVIRONMENT" --arg jwt "$jwt" \
          '{role: $role, jwt: $jwt}' > "$work/login.json"
        bao_call auth/jwt/login --data @"$work/login.json"
        bao_token="$(jq -r '.auth.client_token' "$work/response.json")"
        if [ -z "$bao_token" ] || [ "$bao_token" = "null" ]; then
          echo "::error::OpenBao refused the OIDC token (role ci-$ENVIRONMENT)"
          exit 1
        fi
        echo "::add-mask::$bao_token"

        # 3. Jeton Kubernetes du deployer de ce namespace, qui expire seul
        #    (15 min, 45 min pour les tests de staging : rôle OpenBao)
        printf 'X-Vault-Token: %s\n' "$bao_token" > "$work/bao-header"
        jq -n --arg ns "$NAMESPACE" '{kubernetes_namespace: $ns}' \
          > "$work/creds.json"
        bao_call "kubernetes/creds/$ENVIRONMENT" -H @"$work/bao-header" \
          --data @"$work/creds.json"
        kube_token="$(jq -r '.data.service_account_token' "$work/response.json")"
        if [ -z "$kube_token" ] || [ "$kube_token" = "null" ]; then
          echo "::error::OpenBao gave no Kubernetes token for $NAMESPACE"
          exit 1
        fi
        echo "::add-mask::$kube_token"

        # 4. Fichier de connexion : adresse interne du cluster, certificat
        #    public de son autorité (vérifie qu'on parle au vrai cluster)
        ca="$(printf '%s\n' "$KUBE_CA" | base64 -w0)"
        cat > "$RUNNER_TEMP/kubeconfig" <<EOF
        apiVersion: v1
        kind: Config
        clusters:
          - name: orion
            cluster:
              server: https://kubernetes.default.svc
              certificate-authority-data: $ca
        users:
          - name: deployer
            user:
              token: $kube_token
        contexts:
          - name: $NAMESPACE
            context:
              cluster: orion
              user: deployer
              namespace: $NAMESPACE
        current-context: $NAMESPACE
        EOF
        echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

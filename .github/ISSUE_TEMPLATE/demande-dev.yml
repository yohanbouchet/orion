# Fichier  : .github/ISSUE_TEMPLATE/demande-dev.yml
# Rôle     : formulaire d'issue pour une demande de modification du code de
#            l'application (front ou back), adressée à l'équipe Dev.
# Utilise  : étiquette team:dev (créée dans GitHub)
# Utilisé par : GitHub (Issues → New issue)

name: Demande à l'équipe Dev
description: Modification du code de l'application (front ou back)
title: "[Dev] "
labels: ["team:dev"]
body:
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: >-
        Pourquoi cette demande ? Citer la source : audit, recommandation (R1 à
        R7), alerte de sécurité, incident.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Demande
      description: Ce qui doit changer, et dans quels fichiers si on le sait.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: >-
        Comment vérifier que c'est fait (une case par critère, vérifiable par
        la CI ou par une commande).
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorité
      options:
        - Haute (sécurité ou blocage)
        - Normale
        - Basse
    validations:
      required: true

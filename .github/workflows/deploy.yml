# Fichier  : .github/workflows/deploy.yml
# Rôle     : déploie MicroCRM dans UN environnement (dev, staging ou prod)
#            après avoir vérifié la signature des images, avec
#            scripts/deploy.sh, sur le runner local, avec un jeton
#            court du compte deployer de cet environnement (délivré par
#            OpenBao) ; workflow réutilisable, appelé trois fois par ci.yml
#            (une fois par environnement)
# Utilise  : scripts/deploy.sh, infra/helm/microcrm ; actions
#            .github/actions/cosign (vérification des signatures) et
#            .github/actions/kube-access (kubectl, helm, jeton OpenBao,
#            kubeconfig) ; environnements GitHub dev, staging, production
#            (règle « main seulement », approbation pour production) ;
#            variables de dépôt KUBE_CA et OPENBAO_CA (certificats publics)
# Utilisé par : jobs deploy-dev, deploy-staging, deploy-prod de ci.yml ;
#               ticket #64

name: Deploy

on:
  workflow_call:
    inputs:
      # Environnement GitHub : applique ses règles et figure dans le badge
      # OIDC du job (OpenBao ne rend un jeton que pour celui-là)
      environment:
        type: string
        required: true
      # Namespace Kubernetes visé (prod pour l'environnement production)
      namespace:
        type: string
        required: true
      # Image publiée par la CI (vX.Y.Z) ; vide : celle du commit,
      # sha-xxxxxxx
      tag:
        type: string
        default: ""

# Moindre privilège : lire le code, rien d'autre
permissions:
  contents: read

jobs:
  deploy:
    # Runner local : le seul qui atteint le cluster Minikube
    runs-on: orion-local
    timeout-minutes: 15
    # Applique les règles de l'environnement : branche main seulement ;
    # pour production, attend l'approbation
    environment: ${{ inputs.environment }}
    # id-token : demander à GitHub le badge OIDC du job (présenté à
    # OpenBao) ; aucun autre droit
    permissions:
      contents: read
      id-token: write
    # Un seul déploiement à la fois par environnement, jamais interrompu
    concurrency:
      group: deploy-${{ inputs.namespace }}
      cancel-in-progress: false
    steps:
      # Code du dépôt (script et chart) ; identifiant GitHub non gardé
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Signatures des 2 images vérifiées AVANT tout accès au cluster :
      # signées par le job publish de ci.yml de CE dépôt, sur main, avec
      # un badge OIDC de GitHub ; sinon (image non signée, signée par un
      # autre dépôt, un autre workflow ou une branche) : aucun déploiement
      - name: Install cosign
        uses: ./.github/actions/cosign
      - name: Verify image signatures
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG:-sha-${GITHUB_SHA::7}}"
          workflow=".github/workflows/ci.yml@refs/heads/main"
          identity="https://github.com/$GITHUB_REPOSITORY/$workflow"
          issuer="https://token.actions.githubusercontent.com"
          for component in front back; do
            image="ghcr.io/$GITHUB_REPOSITORY_OWNER/orion-$component:$tag"
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" "$image" >/dev/null
            echo "Signature verified: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          done
      # kubectl et helm à l'empreinte vérifiée, kubeconfig du deployer
      # de cet environnement (action composite du dépôt)
      - name: Kubernetes access
        uses: ./.github/actions/kube-access
        with:
          environment: ${{ inputs.environment }}
          namespace: ${{ inputs.namespace }}
          ca: ${{ vars.KUBE_CA }}
          openbao-ca: ${{ vars.OPENBAO_CA }}
          helm: "true"
      # La même commande qu'en local : contrôles, helm upgrade, test de
      # fumée, retour arrière automatique s'il échoue
      - name: Deploy
        env:
          NAMESPACE: ${{ inputs.namespace }}
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG:-sha-${GITHUB_SHA::7}}"
          scripts/deploy.sh "$NAMESPACE" "$tag"
          echo "Deployed \`$tag\` to \`$NAMESPACE\`" >> "$GITHUB_STEP_SUMMARY"
      # Le jeton ne reste pas sur le disque, même si une étape a échoué
      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"

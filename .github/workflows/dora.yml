# Fichier  : .github/workflows/dora.yml
# Rôle     : calcule chaque jour ouvré (et à la demande) les 5 indicateurs
#            DORA de la prod sur 30 jours : tableau affiché sur la page du
#            run, puis valeurs importées dans VictoriaMetrics (tableau de
#            bord Grafana « Orion - Delivery »)
# Utilise  : scripts/dora.py (API de GitHub, lecture seule) ; runner local
#            orion-local (seul à joindre VictoriaMetrics, dans le cluster) ;
#            règle réseau vmsingle-from-runner (infra/monitoring/extras.yaml)
# Utilisé par : l'équipe et le mentor (Actions → DORA metrics, Grafana) ;
#               ticket #83

name: DORA metrics

on:
  # Jours ouvrés à 8 h et 15 h UTC, poste Ops allumé (le runner local y
  # tourne) ; le tableau du lundi 8 h sert de bilan de la semaine
  schedule:
    - cron: "0 8,15 * * 1-5"
  # Lancement à la main : Actions → DORA metrics → Run workflow
  workflow_dispatch:

# Aucun droit par défaut ; chaque job reçoit le strict nécessaire
permissions: {}

# Une seule exécution à la fois : deux imports simultanés ne se
# mélangent pas (la suivante attend, aucune n'est annulée)
concurrency:
  group: dora-metrics
  cancel-in-progress: false

jobs:
  # 1. Calcul sur une machine de GitHub : Python 3.14 et le jeton
  #    temporaire du job, en lecture seule
  dora:
    name: Compute
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Lecture seule : code, déploiements de la prod, tickets d'incident
    permissions:
      contents: read
      deployments: read # déploiements de la prod et leurs états
      issues: read # tickets « incident »
    outputs:
      metrics: ${{ steps.compute.outputs.metrics }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 3.14, comme en local ; bibliothèque standard seule
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Jeton temporaire du job (lecture seule) : plus d'appels permis
      # par heure que sans jeton ; les valeurs, au format texte de
      # Prometheus, passent au job suivant (sortie multiligne)
      - name: Compute DORA metrics
        id: compute
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DORA_DAYS: "30"
          DORA_METRICS_FILE: ${{ runner.temp }}/dora.prom
        run: |
          python scripts/dora.py
          {
            echo "metrics<<DORA_EOF"
            cat "$DORA_METRICS_FILE"
            echo "DORA_EOF"
          } >> "$GITHUB_OUTPUT"

  # 2. Import dans VictoriaMetrics, depuis le runner local (le cluster
  #    n'est pas joignable depuis GitHub) ; aucun droit GitHub, seulement
  #    sur main (jamais une branche lancée à la main)
  push:
    name: Import into VictoriaMetrics
    needs: dora
    if: github.ref == 'refs/heads/main'
    runs-on: orion-local
    timeout-minutes: 5
    # Aucun droit GitHub : ce job n'appelle que VictoriaMetrics
    permissions: {}
    steps:
      # Valeurs passées par une variable d'environnement, jamais insérées
      # dans le script (injection) ; chaque ligne est contrôlée avant
      # l'envoi : seules des métriques dora_* sont acceptées
      - name: Import into VictoriaMetrics
        env:
          METRICS: ${{ needs.dora.outputs.metrics }}
          VM_URL: http://vmsingle-vm.monitoring.svc:8428
        run: |
          pattern='^dora_[a-z_]+\{[a-z_="0-9,]*\} [0-9.e+-]+$'
          if [ -z "$METRICS" ] ||
            printf '%s\n' "$METRICS" | grep -qvE "$pattern"; then
            echo "::error::unexpected DORA metrics, nothing imported"
            exit 1
          fi
          printf '%s\n' "$METRICS" |
            curl --fail --silent --show-error --max-time 30 \
              --data-binary @- "$VM_URL/api/v1/import/prometheus"
          echo "Imported $(printf '%s\n' "$METRICS" | wc -l) DORA metrics" \
            >> "$GITHUB_STEP_SUMMARY"

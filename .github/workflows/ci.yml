# Fichier  : .github/workflows/ci.yml
# Rôle     : intégration continue de MicroCRM : à chaque PR et à chaque
#            fusion sur main, lance les tests du front et du back en
#            parallèle sur les runners hébergés par GitHub, puis l'analyse
#            SonarQube et son Quality Gate sur le runner local ; en
#            parallèle, les scans de sécurité (gitleaks, hadolint,
#            ShellCheck, Trivy), les tests des scripts (bashunit, pytest),
#            les contrôles du socle Terraform (fmt, validate, test) et du
#            code Ansible (syntaxe, ansible-lint), et la construction des
#            images Docker analysées ; après une fusion sur main,
#            si tout est vert, numéro de version (semantic-release :
#            étiquette vX.Y.Z et Release GitHub) puis publication des images
#            sur GHCR ; déploiement dans dev puis staging (deploy.yml),
#            test d'intrusion passif (zap.yml) puis test de charge de
#            fumée (load-test.yml) de staging, et dans prod après
#            approbation si une version vient d'être publiée ;
#            enfin, sur main, notification du résultat (notify).
# Utilise  : actions officielles de GitHub et de SonarSource, figées par SHA
#            de commit ; images officielles des outils de sécurité, figées
#            par digest ; sonar-project.properties ; environnement sonarqube ;
#            .trivyignore (failles acceptées et datées) ; front/Dockerfile,
#            back/Dockerfile ; .github/release/ (semantic-release) ;
#            scripts/ (install-deps.sh, run-tests.sh, notify.py, tests) ;
#            workflows réutilisables deploy.yml (environnements dev,
#            staging, production), zap.yml et load-test.yml ; jeton
#            automatique GITHUB_TOKEN (version, publication, notification)
# Utilisé par : GitHub Actions (PR, fusions sur main, lancement manuel)

name: CI

# Quand le pipeline se lance
on:
  # À chaque PR vers main (nouvelle PR ou nouveau commit sur la branche)
  pull_request:
    branches: [main]
  # À chaque fusion sur main
  push:
    branches: [main]
  # À la main, depuis l'onglet Actions ; la case permet un exercice
  # d'alerte : notify fait comme si un job avait échoué (ticket + e-mail)
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Notification drill: report a simulated failure"
        type: boolean
        default: false

# Moindre privilège : le jeton du pipeline peut seulement lire le code
permissions:
  contents: read

# Un seul pipeline à la fois par branche ; sur une PR, un nouveau commit
# annule l'exécution précédente, devenue inutile ; sur main, on attend
# la fin (ne jamais couper une version ou une publication en cours)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Image de Trivy, commune aux jobs trivy et images : version et empreinte
# à changer à un seul endroit (un job pourrait la remplacer par son env)
env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  # Tests unitaires du front (Angular, Vitest, navigateur simulé jsdom)
  test-front:
    # Machine virtuelle jetable de GitHub, version d'Ubuntu figée
    runs-on: ubuntu-24.04
    # Coupe la tâche si elle bloque
    timeout-minutes: 15
    # Toutes les commandes run: s'exécutent dans le dossier front/
    defaults:
      run:
        working-directory: front
    steps:
      # Récupère le code ; le jeton n'est pas gardé sur le disque
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 LTS (supporté jusqu'au 30/04/2028), avec cache npm
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json
      # Installation exacte des versions de package-lock.json, sans les
      # scripts d'installation des paquets (scripts/install-deps.sh)
      - name: Install dependencies
        run: ../scripts/install-deps.sh front
      # Tests une seule fois, puis contrôle du rapport de couverture
      # (scripts/run-tests.sh) ; sans navigateur
      - name: Run unit tests
        run: ../scripts/run-tests.sh front
      # Garde le rapport de couverture pour le job sonarqube
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front-reports
          path: front/coverage/microcrm/lcov.info
          retention-days: 7
          if-no-files-found: error

  # Tests du back (Spring Boot, JUnit 5)
  test-back:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Java 17 (version du projet, supportée jusqu'au 31/10/2027), avec
      # cache des dépendances Gradle
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Dépendances résolues et comparées à gradle.lockfile : arrêt si une
      # version ne correspond pas (scripts/install-deps.sh)
      - name: Install dependencies
        run: ../scripts/install-deps.sh back
      # Tests seulement : la compilation des livrables viendra à part
      - name: Run unit and integration tests
        run: ../scripts/run-tests.sh back
      # Bibliothèques du back, pour une analyse SonarQube plus précise
      # (tâche de build.gradle)
      - name: Copy libraries for SonarQube
        run: ./gradlew copySonarLibraries --no-daemon
      # Garde le code compilé, les rapports (JaCoCo, JUnit) et les
      # bibliothèques pour le job sonarqube
      - name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: back-reports
          path: |
            back/build/classes/java
            back/build/reports/jacoco/test/jacocoTestReport.xml
            back/build/test-results/test
            back/build/sonar-libraries
          retention-days: 7
          if-no-files-found: error

  # Analyse SonarQube et Quality Gate, sur le runner local (Minikube) :
  # SonarQube n'est joignable que depuis le cluster
  sonarqube:
    # Attend les deux tests : il a besoin de leurs rapports
    needs: [test-front, test-back]
    # Jamais pour une PR venant d'un fork : son code ne doit pas tourner
    # sur notre runner (OWASP CICD-SEC-4) ; ni pour Dependabot, qui n'a pas
    # accès aux secrets et ne change que des versions, pas le code analysé
    # (un job sauté compte comme réussi pour la protection de main) ; #49
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: orion-local
    timeout-minutes: 15
    # Seul ce job a accès aux secrets de l'environnement sonarqube
    environment: sonarqube
    steps:
      # Historique complet : SonarQube s'en sert pour repérer le code
      # nouveau
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Rapports du front, remis à l'endroit prévu par
      # sonar-project.properties
      - name: Download front reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front-reports
          path: front/coverage/microcrm
      # Code compilé et rapports du back
      - name: Download back reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: back-reports
          path: back/build
      # Analyse (réglages dans sonar-project.properties) puis attente du
      # Quality Gate ; le jeton n'est donné qu'à cette étape
      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # Secrets oubliés (mots de passe, jetons, clés) dans tout l'historique
  # Git ; ticket #20
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Historique complet : un secret effacé reste lisible dans les
      # anciens commits
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Image officielle figée par empreinte (digest), sans réseau, sans
      # droits root, code en lecture seule ; --redact masque les secrets
      # trouvés dans le journal (qui est public)
      - name: Scan for secrets
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD":/repo:ro
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --no-color

  # Bonnes pratiques des Dockerfiles (front, back, infra) ; ticket #20
  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Même durcissement que gitleaks ; ./*/Dockerfile et ./infra/*/Dockerfile
      # prennent tous les Dockerfiles, y compris ceux ajoutés plus tard
      - name: Lint Dockerfiles
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD":/src:ro -w /src
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint --no-color ./*/Dockerfile ./infra/*/Dockerfile

  # Pièges des scripts shell (variables vides, guillemets oubliés…) ;
  # ticket #20
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Même durcissement que gitleaks ; les 3 motifs prennent tous les
      # scripts, la bibliothèque commune et les tests, y compris ceux
      # ajoutés plus tard (* ne descend pas dans les sous-dossiers)
      - name: Lint shell scripts
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD":/src:ro -w /src
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          --color=never scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh

  # Tests unitaires des scripts d'automatisation (bashunit pour Bash,
  # pytest pour Python) ; ticket #56
  script-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Version figée (bashunit n'est pas encore en 1.0) et son empreinte
    # officielle, publiée avec la release
    env:
      BASHUNIT_VERSION: 0.52.0
      BASHUNIT_SHA256: 6193370a2164abcc1e64601af461ea811505c6cefdc8fa33e579a07e2d05ffe3
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Téléchargé depuis la release officielle, puis vérifié : si
      # l'empreinte ne correspond pas, sha256sum échoue et le job s'arrête
      # avant d'exécuter quoi que ce soit (jamais de « curl | bash »)
      - name: Install bashunit
        run: |
          base="https://github.com/TypedDevs/bashunit/releases/download"
          curl -fsSL -o "$RUNNER_TEMP/bashunit" \
            "$base/$BASHUNIT_VERSION/bashunit"
          echo "$BASHUNIT_SHA256  $RUNNER_TEMP/bashunit" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bashunit"
      # Code de sortie 1 si un test échoue : le job passe au rouge
      - name: Run script tests
        run: '"$RUNNER_TEMP/bashunit" scripts/tests'
      # Python 3.14 (supporté jusqu'au 31/10/2030), comme en local
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # pytest et ses dépendances : versions figées, empreintes vérifiées
      # par pip, paquets déjà construits seulement (aucun code exécuté à
      # l'installation)
      - name: Install pytest
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          -r scripts/tests/requirements.txt
      - name: Run Python script tests
        run: python -m pytest -p no:cacheprovider scripts/tests

  # Socle Terraform du cluster (namespaces, comptes deployer) : mise en
  # forme, validité et tests avec un faux fournisseur, sans cluster ni
  # état ; ticket #64
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version figée, la même qu'en local ; sans « wrapper » (inutile ici)
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      # Fournisseur vérifié par .terraform.lock.hcl ; aucun état lu
      - name: Initialize without state
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Unit tests
        run: terraform test

  # Code Ansible du poste Ops (infra/ansible) : syntaxe et bonnes pratiques
  # (ansible-lint, profil « production ») ; le playbook n'est JAMAIS lancé
  # par la CI : il agit sur la machine hôte, avec sudo
  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 3.14 (supporté jusqu'au 31/10/2030), comme en local
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # ansible-core et ansible-lint : versions et empreintes figées,
      # paquets déjà construits seulement (aucun code exécuté à
      # l'installation)
      - name: Install Ansible tools
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          -r requirements-ci.txt
      # Collections aux versions figées de requirements.yml
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p collections
      - name: Check the playbook syntax
        run: ansible-playbook site.yml --syntax-check
      - name: Lint
        run: ansible-lint

  # Failles connues dans les dépendances (npm, Gradle) : bloque sur les
  # failles hautes et critiques, sauf exceptions justifiées et datées dans
  # .trivyignore (docs/02, section 2.7) ; ticket #20
  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toutes les failles, sans bloquer, y compris celles acceptées dans
      # .trivyignore (--ignorefile "" désactive ce fichier) et celles des
      # devDependencies (--include-dev-deps, ignorées par défaut) : dans le
      # journal et dans le résumé du job ; base de failles gardée dans /cache
      - name: List all vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/src:ro -w /src -v "$RUNNER_TEMP/trivy":/cache \
            "$TRIVY_IMAGE" fs --scanners vuln --cache-dir /cache \
            --no-progress --include-dev-deps --ignorefile "" . \
            | tee "$RUNNER_TEMP/trivy-report.txt"
          {
            echo '```'
            cat "$RUNNER_TEMP/trivy-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Seuil bloquant : code 1 (job rouge) s'il existe une faille haute
      # ou critique, devDependencies comprises (outillage exécuté dans la
      # CI et sur les postes), sauf celles acceptées et datées dans
      # .trivyignore (lu automatiquement à la racine) ; #35
      - name: Fail on high and critical vulnerabilities
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD":/src:ro -w /src -v "$RUNNER_TEMP/trivy":/cache
          "$TRIVY_IMAGE" fs --scanners vuln --cache-dir /cache
          --no-progress --quiet --include-dev-deps
          --severity HIGH,CRITICAL --exit-code 1 .

  # Images Docker du front et du back : construites et analysées à chaque
  # PR et à chaque fusion ; sur main, gardées pour le job publish ; #27
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Le même job, lancé deux fois en parallèle : une fois par image
    strategy:
      # Si une image échoue, l'autre va quand même au bout
      fail-fast: false
      matrix:
        component: [front, back]
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Étiquettes OCI : lien vers le dépôt (GHCR rattache l'image au dépôt)
      # et commit exact (traçabilité)
      - name: Build image
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: >-
          docker build
          --label "org.opencontainers.image.source=$REPO_URL"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "orion-$COMPONENT:$GITHUB_SHA" "$COMPONENT"
      # Image enregistrée dans un fichier : analysée sans accès à Docker,
      # puis transmise telle quelle au job publish
      - name: Save image to a file
        run: >-
          docker save "orion-$COMPONENT:$GITHUB_SHA"
          -o "$RUNNER_TEMP/image.tar"
      # Seuil bloquant : code 1 s'il existe une faille haute ou critique
      - name: Scan image
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/image.tar":/image.tar:ro \
            -v "$RUNNER_TEMP/trivy":/cache \
            "$TRIVY_IMAGE" image --input /image.tar --scanners vuln \
            --cache-dir /cache --no-progress \
            --severity HIGH,CRITICAL --exit-code 1
      # Sur main seulement : l'image analysée est gardée 1 jour pour publish
      - name: Keep image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  # Version vX.Y.Z calculée par semantic-release à partir des commits
  # conventionnels : étiquette Git + Release GitHub, aucun commit poussé
  # sur main (branche protégée) ; après une fusion, si tout est vert ; #31
  release:
    needs:
      - test-front
      - test-back
      - sonarqube
      - gitleaks
      - hadolint
      - shellcheck
      - script-tests
      - terraform
      - ansible
      - trivy
      - images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Créer l'étiquette et la Release, rien d'autre (moindre privilège)
    permissions:
      contents: write
    # Version publiée (ex. v1.2.3), vide si aucun commit fix ou feat
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Historique complet et étiquettes : semantic-release lit les commits
      # depuis la dernière version ; jeton non gardé dans .git/config
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      # Versions exactes du package-lock.json, sans script d'installation
      - name: Install semantic-release
        working-directory: .github/release
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run semantic-release
        working-directory: .github/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
      # Étiquette posée sur ce commit par semantic-release, s'il y en a une
      - name: Read version
        id: version
        run: |
          version="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: \`${version:-none}\`" >> "$GITHUB_STEP_SUMMARY"

  # Publication sur GHCR : seulement après une fusion sur main, et seulement
  # si tous les contrôles sont verts ; l'image publiée est celle analysée
  publish:
    needs:
      - test-front
      - test-back
      - sonarqube
      - gitleaks
      - hadolint
      - shellcheck
      - script-tests
      - terraform
      - ansible
      - trivy
      - images
      - release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Seul job autorisé à écrire dans le registre (moindre privilège)
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [front, back]
    env:
      COMPONENT: ${{ matrix.component }}
      # Version publiée par le job release (vide s'il n'y en a pas)
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}
      - name: Load image
        run: docker load -i "$RUNNER_TEMP/image.tar"
      # Jeton automatique du pipeline, passé par l'entrée standard : il
      # n'apparaît ni dans la commande ni dans le journal
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          echo "$GHCR_TOKEN" |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Étiquette du commit (sha-xxxxxxx) ; l'empreinte publiée est écrite
      # dans le résumé du run (traçabilité, réutilisée par Helm)
      - name: Push image
        run: |
          registry="ghcr.io/$GITHUB_REPOSITORY_OWNER"
          target="$registry/orion-$COMPONENT:sha-${GITHUB_SHA::7}"
          docker tag "orion-$COMPONENT:$GITHUB_SHA" "$target"
          docker push "$target"
          digest="$(docker inspect \
            --format '{{index .RepoDigests 0}}' "$target")"
          echo "Published: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      # Si une version vient d'être publiée : même image, 2e étiquette
      # (ex. v1.2.3), même empreinte que l'étiquette sha-xxxxxxx
      - name: Push version tag
        if: env.VERSION != ''
        run: |
          registry="ghcr.io/$GITHUB_REPOSITORY_OWNER"
          target="$registry/orion-$COMPONENT:$VERSION"
          docker tag "orion-$COMPONENT:$GITHUB_SHA" "$target"
          docker push "$target"
          echo "Version tag: \`$target\`" >> "$GITHUB_STEP_SUMMARY"
      # Retire l'identifiant de la machine, même si une étape a échoué
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Déploiement continu (workflow réutilisable deploy.yml, runner local) :
  # dev après chaque publication sur main, puis staging avec la même image
  # (sha-xxxxxxx) ; ticket #64
  deploy-dev:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      namespace: dev
    # Seulement le jeton du deployer, pas « secrets: inherit » (tous les
    # secrets du dépôt, même ceux ajoutés plus tard) : moindre privilège
    secrets:
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

  deploy-staging:
    needs: deploy-dev
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      namespace: staging
    # Seulement le jeton du deployer, pas « secrets: inherit » (tous les
    # secrets du dépôt, même ceux ajoutés plus tard) : moindre privilège
    secrets:
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

  # Test d'intrusion passif (ZAP baseline) de staging, à chaque
  # déploiement ; une alerte réglée sur FAIL (infra/zap/rules.tsv) bloque
  # la prod
  zap:
    needs: deploy-staging
    uses: ./.github/workflows/zap.yml
    with:
      mode: baseline
    # Seulement le jeton du deployer, pas « secrets: inherit » (tous les
    # secrets du dépôt, même ceux ajoutés plus tard) : moindre privilège
    secrets:
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

  # Test de charge de fumée (k6, 1 utilisateur, 30 s) de staging, après
  # ZAP (jamais en même temps : les mesures seraient faussées) ; un seuil
  # dépassé (erreurs, temps de réponse) bloque la prod ; ticket #92
  load-test:
    needs: zap
    uses: ./.github/workflows/load-test.yml
    with:
      profile: smoke
    # Seulement le jeton du deployer, pas « secrets: inherit » (tous les
    # secrets du dépôt, même ceux ajoutés plus tard) : moindre privilège
    secrets:
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

  # Prod seulement si une version vX.Y.Z vient d'être publiée, si ZAP et le
  # test de charge n'ont rien trouvé de bloquant, et après l'approbation
  # demandée par l'environnement production
  deploy-prod:
    needs: [release, zap, load-test]
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      namespace: prod
      tag: ${{ needs.release.outputs.version }}
    # Seulement le jeton du deployer, pas « secrets: inherit » (tous les
    # secrets du dépôt, même ceux ajoutés plus tard) : moindre privilège
    secrets:
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}

  # Notification du résultat sur main (ticket de panne, e-mail par GitHub),
  # même si un job a échoué (always) ; ticket #56
  notify:
    needs:
      - test-front
      - test-back
      - sonarqube
      - gitleaks
      - hadolint
      - shellcheck
      - script-tests
      - terraform
      - ansible
      - trivy
      - images
      - release
      - publish
      # Sans deploy-prod : il peut attendre l'approbation des jours ;
      # son résultat est vu par la personne qui approuve
      - deploy-dev
      - deploy-staging
      - zap
      - load-test
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Ouvrir, commenter et fermer le ticket de panne, rien d'autre
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Résultat de chaque job (needs) et case de l'exercice d'alerte
      # (vide hors lancement manuel, donc false)
      - name: Notify the result
        run: python scripts/notify.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure || false }}

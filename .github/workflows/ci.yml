# Fichier  : .github/workflows/ci.yml
# Rôle     : intégration continue de MicroCRM : à chaque PR et à chaque
#            fusion sur main, lance les tests du front et du back en
#            parallèle sur les runners hébergés par GitHub, puis l'analyse
#            SonarQube et son Quality Gate sur le runner local.
# Utilise  : actions officielles de GitHub et de SonarSource, figées par SHA
#            de commit ; sonar-project.properties ; environnement sonarqube
# Utilisé par : GitHub Actions (PR, fusions sur main, lancement manuel)

name: CI

# Quand le pipeline se lance
on:
  # À chaque PR vers main (nouvelle PR ou nouveau commit sur la branche)
  pull_request:
    branches: [main]
  # À chaque fusion sur main
  push:
    branches: [main]
  # À la main, depuis l'onglet Actions
  workflow_dispatch:

# Moindre privilège : le jeton du pipeline peut seulement lire le code
permissions:
  contents: read

# Un seul pipeline à la fois par branche : un nouveau commit annule
# l'exécution précédente, devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests unitaires du front (Angular, Karma + Jasmine, Chrome sans écran)
  test-front:
    # Machine virtuelle jetable de GitHub, version d'Ubuntu figée
    runs-on: ubuntu-24.04
    # Coupe la tâche si elle bloque
    timeout-minutes: 15
    # Toutes les commandes run: s'exécutent dans le dossier front/
    defaults:
      run:
        working-directory: front
    steps:
      # Récupère le code ; le jeton n'est pas gardé sur le disque
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 LTS (supporté jusqu'au 30/04/2028), avec cache npm
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json
      # Installation exacte des versions de package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # Tests une seule fois (pas de surveillance), Chrome préinstallé
      - name: Run unit tests
        run: >-
          npx ng test --no-watch --no-progress
          --browsers=ChromeHeadlessNoSandbox
      # Garde le rapport de couverture pour le job sonarqube
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front-reports
          path: front/coverage/microcrm/lcov.info
          retention-days: 7
          if-no-files-found: error

  # Tests du back (Spring Boot, JUnit 5)
  test-back:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Java 17 (version du projet, supportée jusqu'au 31/10/2027), avec
      # cache des dépendances Gradle
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Tests seulement : la compilation des livrables viendra à part
      - name: Run unit and integration tests
        run: ./gradlew test --no-daemon
      # Garde le code compilé et les rapports (JaCoCo, JUnit) pour le job
      # sonarqube
      - name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: back-reports
          path: |
            back/build/classes/java
            back/build/reports/jacoco/test/jacocoTestReport.xml
            back/build/test-results/test
          retention-days: 7
          if-no-files-found: error

  # Analyse SonarQube et Quality Gate, sur le runner local (Minikube) :
  # SonarQube n'est joignable que depuis le cluster
  sonarqube:
    # Attend les deux tests : il a besoin de leurs rapports
    needs: [test-front, test-back]
    # Jamais pour une PR venant d'un fork : son code ne doit pas tourner
    # sur notre runner (OWASP CICD-SEC-4)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: orion-local
    timeout-minutes: 15
    # Seul ce job a accès aux secrets de l'environnement sonarqube
    environment: sonarqube
    steps:
      # Historique complet : SonarQube s'en sert pour repérer le code
      # nouveau
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Rapports du front, remis à l'endroit prévu par
      # sonar-project.properties
      - name: Download front reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: front-reports
          path: front/coverage/microcrm
      # Code compilé et rapports du back
      - name: Download back reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: back-reports
          path: back/build
      # Analyse (réglages dans sonar-project.properties) puis attente du
      # Quality Gate ; le jeton n'est donné qu'à cette étape
      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # Secrets oubliés (mots de passe, jetons, clés) dans tout l'historique
  # Git ; ticket #20
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Historique complet : un secret effacé reste lisible dans les
      # anciens commits
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Image officielle figée par empreinte (digest), sans réseau, sans
      # droits root, code en lecture seule ; --redact masque les secrets
      # trouvés dans le journal (qui est public)
      - name: Scan for secrets
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD":/repo:ro
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --no-color

  # Bonnes pratiques des Dockerfiles ; le Dockerfile racine est exclu
  # jusqu'à sa réécriture (R3) ; ticket #20
  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Même durcissement que gitleaks ; infra/*/Dockerfile prend tous les
      # Dockerfiles de infra/, y compris ceux ajoutés plus tard
      - name: Lint Dockerfiles
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD":/src:ro -w /src
          hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint --no-color infra/*/Dockerfile

  # Pièges des scripts shell (variables vides, guillemets oubliés…) ;
  # ticket #20
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Même durcissement que gitleaks ; scripts/*.sh prend tous les
      # scripts, y compris ceux ajoutés plus tard
      - name: Lint shell scripts
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD":/src:ro -w /src
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          --color=never scripts/*.sh

# Fichier  : .github/dependabot.yml
# Rôle     : mises à jour de version proposées par Dependabot (une PR
#            relue et testée par la CI) : paquets npm, Gradle, pip, actions
#            GitHub, images Docker ; chaque lundi, après un délai de
#            refroidissement. Les mises à jour de SÉCURITÉ ne dépendent pas
#            de ce fichier : elles arrivent tout de suite (docs/02, 2.7).
# Utilise  : front/, .github/release/, scripts/tests/, back/,
#            .github/workflows/, Dockerfiles du front, du back et de
#            infra/postgres
# Utilisé par : GitHub Dependabot ; tickets #38 et #56

version: 2
updates:
  # Front (Angular) et outil de version (semantic-release)
  - package-ecosystem: npm
    directories:
      - /front
      - /.github/release
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # Refroidissement (docs/02, 2.7) : 3 jours, 7 pour une majeure ;
    # jamais appliqué aux mises à jour de sécurité
    cooldown:
      default-days: 3
      semver-major-days: 7
    # Mineures et correctifs dans une seule PR : moins de PR, testées ensemble
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # Montent avec Angular, pas à pas avec ng update (recommandation R4) :
    # Angular en version majeure ; TypeScript et zone.js imposés par
    # Angular 17, même en version mineure
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@angular-devkit/*"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: zone.js
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Tests : Jasmine 6+ incompatible avec Karma et Angular 17 (passage à
      # Vitest prévu avec R4)
      - dependency-name: jasmine-core
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/jasmine"
        update-types:
          - version-update:semver-major
      # Outil de version (.github/release) : la v10 exige un générateur de
      # notes plus récent que celui de semantic-release 25 (essai du 01/11 :
      # job release en échec) ; à monter avec release-notes-generator 15
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
    # Conventional Commits : build(deps): … et build(deps-dev): …
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
  # Outils de test des scripts Python : pytest et ses dépendances,
  # empreintes comprises (scripts/tests/requirements.txt)
  - package-ecosystem: pip
    directory: /scripts/tests
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope
  # Socle Terraform : fournisseur Kubernetes (verrouillé par
  # .terraform.lock.hcl) ; PR testée par le job terraform
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: build
      include: scope
  # Back (Spring Boot) : versions verrouillées par gradle.lockfile
  - package-ecosystem: gradle
    directory: /back
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope

  # Actions des workflows, figées par SHA : Dependabot met à jour le SHA
  # et le commentaire de version
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # Pas de SemVer garanti pour les actions : un seul délai, 3 jours
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope
  # Images de base des Dockerfiles, figées par étiquette et empreinte
  - package-ecosystem: docker
    directories:
      - /front
      - /back
      - /infra/postgres
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # Pas de SemVer garanti pour les étiquettes d'images : un seul délai,
    # 3 jours
    cooldown:
      default-days: 3
    # Changements décidés, pas automatiques : version de Java (LTS 17, 21,
    # 25), de Node (avec Angular, R4), de PostgreSQL (migration des
    # données) ; nginx reste sur sa branche stable (numéro mineur pair)
    ignore:
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      - dependency-name: nginxinc/nginx-unprivileged
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: build
      include: scope

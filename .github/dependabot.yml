# Fichier  : .github/dependabot.yml
# Rôle     : mises à jour de version proposées par Dependabot (une PR
#            relue et testée par la CI) : paquets npm, Gradle, pip, actions
#            GitHub, images Docker ; chaque lundi, après un délai de
#            refroidissement. Les mises à jour de SÉCURITÉ ne dépendent pas
#            de ce fichier : elles arrivent tout de suite (docs/02, 2.7).
# Utilise  : front/, .github/release/, scripts/tests/, infra/ansible/,
#            back/, .github/workflows/, Dockerfiles du front, du back, de
#            infra/postgres et de infra/zap
# Utilisé par : GitHub Dependabot ; tickets #38 et #56

version: 2
updates:
  # Front (Angular)
  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # Refroidissement (docs/02, 2.7) : 7 jours, 14 pour une majeure
    # (minimum conseillé par zizmor : 7 ; 3 jusqu'au 10/11/2026) ; jamais
    # appliqué aux mises à jour de sécurité
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Mineures et correctifs dans une seule PR : moins de PR, testées ensemble
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # Montent avec Angular, pas à pas avec ng update (recommandation R4) :
    # Angular en version majeure ; TypeScript et zone.js imposés par
    # Angular 22, même en version mineure
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@angular-devkit/*"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: zone.js
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Tests : versions majeures de Vitest acceptées par Angular 22
      # (@angular/build : 4 ou 5) ; la suivante montera avec Angular
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/*"
        update-types:
          - version-update:semver-major
    # Conventional Commits. Dépendances livrées au navigateur :
    # fix(deps): … → nouvelle version, qui ira en prod ; outils de
    # développement : build(deps-dev): … → pas de version (.releaserc.yml)
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope
  # Outil de version (semantic-release) : outil de la CI, jamais livré
  # → build(deps): …, pas de nouvelle version
  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      release-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # La v10 exige un générateur de notes plus récent que celui de
      # semantic-release 25 (essai du 01/11 : job release en échec) ; à
      # monter avec release-notes-generator 15
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
  # Outils Python de la CI, empreintes comprises : pytest
  # (scripts/tests/requirements.txt), ansible-core et ansible-lint
  # (infra/ansible/requirements-ci.txt)
  # Tests de bout en bout (Playwright, e2e/) : même rythme ; la version de
  # l'image mcr.microsoft.com/playwright de e2e/compose.yaml doit suivre
  # celle du paquet (sinon le job e2e échoue : navigateurs introuvables),
  # à monter à la main dans la même PR
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: pip
    directories:
      - /scripts/tests
      - /infra/ansible
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope
  # Socle du cluster, supervision et configuration d'OpenBao (OpenTofu) :
  # fournisseurs Kubernetes, Helm, TLS et Vault (verrouillés par
  # .terraform.lock.hcl) ; PR testée par le job opentofu
  - package-ecosystem: opentofu
    directories:
      - /infra/terraform
      - /infra/openbao/config
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: build
      include: scope
  # Back (Spring Boot) : versions verrouillées par gradle.lockfile
  - package-ecosystem: gradle
    directory: /back
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch
    # Bibliothèques livrées dans le jar : fix(deps): … → nouvelle
    # version (celles des tests suivent la même règle)
    commit-message:
      prefix: fix
      include: scope

  # Actions des workflows, figées par SHA : Dependabot met à jour le SHA
  # et le commentaire de version
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # Pas de SemVer garanti pour les actions : un seul délai, 7 jours
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
      include: scope
  # Images de base des Dockerfiles, figées par étiquette et empreinte
  - package-ecosystem: docker
    directories:
      - /front
      - /back
      - /infra/postgres
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # Pas de SemVer garanti pour les étiquettes d'images : un seul délai,
    # 7 jours
    cooldown:
      default-days: 7
    # Changements décidés, pas automatiques : version de Java (LTS 17, 21,
    # 25), de Node (avec Angular, R4), de PostgreSQL (migration des
    # données) ; nginx reste sur sa branche stable (numéro mineur pair)
    ignore:
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      - dependency-name: nginxinc/nginx-unprivileged
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    # Images livrées (front, back, base de données) : fix(deps): … →
    # nouvelle version, qui ira en prod
    commit-message:
      prefix: fix
      include: scope
  # Image du test d'intrusion (outil de la CI, jamais livrée) :
  # build(deps): …, pas de nouvelle version
  - package-ecosystem: docker
    directory: /infra/zap
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

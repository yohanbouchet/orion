# Fichier  : front/nginx.conf
# Rôle     : configuration du serveur web du front : sert les fichiers
#            d'Angular sur le port 8080, renvoie toute route inconnue vers
#            index.html, ajoute des en-têtes de sécurité, écrit un journal
#            d'accès en JSON (sans les sondes) ; inclut les règles
#            facultatives de /etc/nginx/extra/ (relais /api vers le back,
#            fourni au déploiement)
# Utilise  : fichiers produits par « ng build » (copiés par front/Dockerfile)
# Utilisé par : front/Dockerfile (copié dans /etc/nginx/conf.d/) ; chart
#               Helm infra/helm/microcrm (ticket #64)

# Durée de conservation en cache, choisie selon l'adresse (map : une
# seule règle add_header plus bas ; un add_header dans un bloc location
# annulerait tous les en-têtes de sécurité du serveur pour ces fichiers)
map $uri $front_cache_control {
    # Réponses de l'API : données personnelles (contacts), jamais gardées
    # par un cache, ni du navigateur ni d'un proxy partagé (OWASP ASVS)
    ~^/api/                       "no-store";
    # Fichiers d'Angular dont le nom contient une empreinte (ex.
    # main-55UN7KL3.js) : un nouveau contenu a un nouveau nom, ils peuvent
    # donc être gardés un an sans être redemandés
    "~-[A-Z0-9]{8}\.(js|css)$"     "public, max-age=31536000, immutable";
    # Tout le reste (index.html, favicon…) : gardé, mais revalidé à chaque
    # fois (réponse 304 si rien n'a changé) : une nouvelle version du site
    # est vue tout de suite après un déploiement
    default                       "no-cache";
}

# Sondes de Kubernetes (une requête toutes les quelques secondes) : pas
# écrites dans le journal, qui ne garde que les vraies visites
map $http_user_agent $front_loggable {
    ~^kube-probe/  0;
    default        1;
}

# Chemin demandé par le client, sans ses paramètres (après « ? ») : une
# donnée passée dans l'adresse n'est jamais écrite (OWASP Logging Cheat
# Sheet) ; $uri ne convient pas : après try_files, il vaut /index.html
# pour toute route d'Angular, et le chemin essayé par un attaquant serait
# perdu
map $request_uri $front_path {
    "~^(?<path>[^?]*)"  $path;
}

# Journal d'accès au format JSON : une ligne = un objet, lu champ par
# champ par VictoriaLogs (ex. status:404) ; escape=json protège les
# guillemets d'une valeur envoyée par le client. « message » devient le
# texte affiché de la ligne, « time » son heure
log_format front_json escape=json
    '{"time":"$time_iso8601",'
    '"message":"$request_method $front_path $status",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$front_path",'
    '"status":"$status",'
    '"bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

server {
    # Port non privilégié : nginx tourne sans root
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas afficher la version de nginx (information utile à un attaquant)
    server_tokens off;

    # Journal d'accès en JSON (format défini en tête de fichier), vers la
    # sortie du conteneur (ce fichier y est relié dans l'image), sauf les
    # sondes
    access_log /var/log/nginx/access.log front_json if=$front_loggable;

    # En-têtes de sécurité, ajoutés à toutes les réponses (always)
    # - nosniff : le navigateur respecte le type annoncé des fichiers
    add_header X-Content-Type-Options "nosniff" always;
    # - DENY : le site ne peut pas être affiché dans un cadre (anti-clic piégé)
    add_header X-Frame-Options "DENY" always;
    # - no-referrer : l'adresse de la page n'est pas transmise aux autres sites
    add_header Referrer-Policy "no-referrer" always;
    # - CSP : le navigateur ne charge que les sources listées ; scripts et
    #   styles du site seulement, jamais en ligne (bloque le XSS injecté ;
    #   Bulma intégré au site depuis Angular 22, « CSS critique » en ligne
    #   désactivé dans angular.json), appels d'API vers le site, aucun
    #   plugin, pas d'affichage dans un cadre ; testé dans Chrome (08/11)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # - Permissions-Policy : caméra, micro, position, paiement, USB refusés
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # - isolation (attaques de type Spectre) : la page ne partage pas sa
    #   fenêtre ni ses fichiers avec d'autres sites ; tout fichier d'un
    #   autre site devrait l'autoriser (aucun n'est chargé)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # - cache : durée choisie par la map en tête de fichier (alerte
    #   « Storable and Cacheable Content » de ZAP, 09/11/2026)
    add_header Cache-Control $front_cache_control always;

    # Compression (gzip) des fichiers du site : la feuille de style, Bulma
    # compris, passe de 677 à 66 Ko (niveau 6, au lieu de 1 par défaut :
    # 87 Ko) ; pas les réponses de l'API (JSON), qui contiennent des
    # données (attaque BREACH) ; Vary : un cache garde une version
    # compressée et une non compressée
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript;
    gzip_vary on;

    # Règles ajoutées au déploiement (ex. relais /api vers le back, fourni
    # par le chart Helm, qui connaît l'adresse du back) ; sans fichier,
    # rien n'est inclus et l'image démarre seule (docker run)
    include /etc/nginx/extra/*.conf;

    # Routes d'Angular (ex. /persons/1) : le fichier n'existe pas sur le
    # disque, nginx renvoie index.html et Angular affiche la bonne page
    location / {
        try_files $uri $uri/ /index.html;
    }
}

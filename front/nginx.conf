# Fichier  : front/nginx.conf
# Rôle     : configuration du serveur web du front : sert les fichiers
#            d'Angular sur le port 8080, renvoie toute route inconnue vers
#            index.html, ajoute des en-têtes de sécurité ; inclut les
#            règles facultatives de /etc/nginx/extra/ (relais /api vers le
#            back, fourni au déploiement)
# Utilise  : fichiers produits par « ng build » (copiés par front/Dockerfile)
# Utilisé par : front/Dockerfile (copié dans /etc/nginx/conf.d/) ; chart
#               Helm infra/helm/microcrm (ticket #64)

server {
    # Port non privilégié : nginx tourne sans root
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas afficher la version de nginx (information utile à un attaquant)
    server_tokens off;

    # En-têtes de sécurité, ajoutés à toutes les réponses (always)
    # - nosniff : le navigateur respecte le type annoncé des fichiers
    add_header X-Content-Type-Options "nosniff" always;
    # - DENY : le site ne peut pas être affiché dans un cadre (anti-clic piégé)
    add_header X-Frame-Options "DENY" always;
    # - no-referrer : l'adresse de la page n'est pas transmise aux autres sites
    add_header Referrer-Policy "no-referrer" always;
    # - CSP : le navigateur ne charge que les sources listées ; scripts du
    #   site seulement (bloque le XSS injecté), styles du site et du CDN de
    #   Bulma, appels d'API vers le site, aucun plugin, pas d'affichage dans
    #   un cadre ; testé dans Chromium et Firefox (03/11/2026)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # - Permissions-Policy : caméra, micro, position, paiement, USB refusés
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # - isolation (attaques de type Spectre) : la page ne partage pas sa
    #   fenêtre ni ses fichiers avec d'autres sites ; tout fichier d'un
    #   autre site doit l'autoriser (le CDN de Bulma le fait)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Règles ajoutées au déploiement (ex. relais /api vers le back, fourni
    # par le chart Helm, qui connaît l'adresse du back) ; sans fichier,
    # rien n'est inclus et l'image démarre seule (docker run)
    include /etc/nginx/extra/*.conf;

    # Routes d'Angular (ex. /persons/1) : le fichier n'existe pas sur le
    # disque, nginx renvoie index.html et Angular affiche la bonne page
    location / {
        try_files $uri $uri/ /index.html;
    }
}

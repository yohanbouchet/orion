plugins {
	id 'java'
	// Couverture des tests (rapport lu par SonarQube), ticket #13
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.adarshr.test-logger' version '4.0.0'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	// Après les tests, produire le rapport de couverture
	finalizedBy jacocoTestReport
}

// Version de JaCoCo figée : pas de changement silencieux à une mise à jour
// de Gradle
jacoco {
	toolVersion = '0.8.15'
}

// XML pour SonarQube, HTML pour une lecture humaine
// (back/build/reports/jacoco/test/)
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

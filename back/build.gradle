plugins {
	id 'java'
	// Couverture des tests (rapport lu par SonarQube), ticket #13
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.adarshr.test-logger' version '4.0.0'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

// Versions exactes de toutes les dépendances figées dans gradle.lockfile :
// builds reproductibles, dépendances visibles par Trivy (ticket #21)
dependencyLocking {
	lockAllConfigurations()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	// Flyway : crée et fait évoluer les tables par des scripts SQL numérotés
	// (src/main/resources/db/migration), appliqués au démarrage (ticket #66)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	// Supervision (ticket #84) : Actuator publie la santé et les métriques
	// (port de gestion séparé, voir application.properties) ; Micrometer
	// les met au format Prometheus, lu par VictoriaMetrics
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	// Base en mémoire HSQLDB quand aucune base n'est configurée (tests,
	// poste de dev) ; PostgreSQL quand SPRING_DATASOURCE_URL est fournie.
	// Versions gérées par Spring Boot, figées dans gradle.lockfile
	runtimeOnly 'org.hsqldb:hsqldb'
	runtimeOnly 'org.flywaydb:flyway-database-hsqldb'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	// Après les tests, produire le rapport de couverture
	finalizedBy jacocoTestReport
}

// Version de JaCoCo figée : pas de changement silencieux à une mise à jour
// de Gradle
jacoco {
	toolVersion = '0.8.15'
}

// XML pour SonarQube, HTML pour une lecture humaine
// (back/build/reports/jacoco/test/)
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// Bibliothèques du code et des tests, copiées pour SonarQube
// (sonar.java.libraries) : le job sonarqube n'a pas Gradle ; sans elles,
// son analyse du Java est moins précise. Tests : seulement celles en plus
tasks.register('copySonarLibraries', Sync) {
	into layout.buildDirectory.dir('sonar-libraries')
	from(configurations.compileClasspath) { into 'main' }
	from(configurations.testCompileClasspath - configurations.compileClasspath) {
		into 'test'
	}
}

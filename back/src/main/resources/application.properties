# Fichier  : back/src/main/resources/application.properties
# Rôle     : réglages de Spring Boot (nom, base de données, schéma)
# Utilisé par : le back au démarrage ; surchargé par les variables
#               d'environnement SPRING_* (Kubernetes)

spring.application.name=microcrm

# Base de données (ticket #66) : sans réglage, HSQLDB en mémoire (tests,
# poste de dev). PostgreSQL : variables d'environnement fournies au
# déploiement (Secret Kubernetes), jamais écrites dans le dépôt :
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD

# Les tables sont créées par Flyway (db/migration) ; Hibernate vérifie
# seulement au démarrage qu'elles correspondent aux entités
spring.jpa.hibernate.ddl-auto=validate

# Dates (Instant) toujours en « timestamp with time zone », sur PostgreSQL
# comme sur HSQLDB : un seul script Flyway valable pour les deux bases
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP_WITH_TIMEZONE

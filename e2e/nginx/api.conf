# Fichier  : e2e/nginx/api.conf
# Rôle     : /api/ relayé vers le back, comme en production (même réglage
#            que le chart Helm, templates/front-nginx-config.yaml)
# Utilisé par : compose.yaml (monté dans /etc/nginx/extra, inclus dans le
#               bloc server du front)
location /api/ {
    proxy_pass http://back/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Fichier  : e2e/nginx/upstream.conf
# Rôle     : copie, pour les tests de bout en bout, du relais vers le back
#            que le chart Helm ajoute au front (templates/
#            front-nginx-config.yaml) ; le back s'appelle ici « back »
# Utilisé par : compose.yaml (monté dans /etc/nginx/conf.d : niveau http,
#               comme dans le chart)
upstream back {
    server back:8080;
    keepalive 16;
    keepalive_timeout 15s;
}
